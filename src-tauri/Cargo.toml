[package]
name = "kaido"
version = "0.0.0"
description = "Notes and tasks for developers, stored as Markdown in your own git repo."
authors = ["Kaido contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/carlosdlf/kaido-app"
edition = "2024"
rust-version = "1.85"

[lib]
# Distinct from the binary name to avoid output file collisions on Windows.
name = "kaido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
